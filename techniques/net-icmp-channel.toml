id = "net-icmp-channel"
name = "ICMP egress channel"
category = "net"
description = "Pings a constant external address. ICMP reachability is the carrier for ICMP tunnels: policies that only filter TCP/UDP leave it wide open. No payload, one echo request to 1.1.1.1."
references = [
  "icmpsh / ptunnel class: ICMP as a bidirectional covert channel",
  "Egress checklists that forget protocol 1",
]

probe = '''
if ping -c 1 -W 5 1.1.1.1 >/dev/null 2>&1; then echo ESCAPED; fi
'''

[preconditions]
bins = ["ping"]
timeout = 30
oracle = "stdout"

