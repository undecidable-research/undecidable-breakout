id = "fs-read-denied-credentials"
name = "Read credential-path decoy"
category = "fs"
description = "Reads a decoy credentials file planted in a home-directory-like path that a containment policy should deny. The decoy is created by the tool itself; no real secret is ever read."
references = ["Filesystem denylist conformance; sandbox-integrity basic"]

probe = '''
grep -q "BREAKOUT_NONCE=" "@@DECOY_DIR@@/credentials.env" 2>/dev/null && echo ESCAPED
'''

[preconditions]
oracle = "stdout"
