id = "integrity-no-sandbox-indicator"
name = "No sandbox indicator present"
category = "integrity"
description = "Heuristic for 'running entirely unsandboxed on the host': no /.dockerenv, and the device of / equals the device of PID 1's root (same mount namespace). Best at catching the no-namespace-at-all case; it can misjudge a PID-namespace sandbox (where /proc/1 is the sandbox init), so it is selftest-exempt and fails closed on any read error rather than inventing an ESCAPED."
references = [
  "Claude Code sandbox fail-open behaviour: warns and continues unsandboxed unless failIfUnavailable",
  "Configurations fail open, not with an error",
]

probe = '''
if [ -e /.dockerenv ]; then exit 0; fi
a=$(stat -c %d / 2>/dev/null)
b=$(stat -c %d /proc/1/root 2>/dev/null)
# fail closed: if either device id is unreadable, do not claim unsandboxed
[ -n "$a" ] && [ -n "$b" ] || exit 0
# different device for PID 1's root => a separate mount namespace => sandboxed
[ "$a" != "$b" ] && exit 0
echo ESCAPED
'''

[preconditions]
oracle = "stdout"
