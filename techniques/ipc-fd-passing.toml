id = "ipc-fd-passing"
name = "File-descriptor passing over a UNIX socket (SCM_RIGHTS)"
category = "ipc"
description = "Opens a planted decoy through an already-open file descriptor and hands that descriptor to a second process over a UNIX socketpair using SCM_RIGHTS ancillary data; the receiver reads the secret through the passed fd. Whoever holds an fd holds the object it points at, regardless of any path-based policy the receiver is under — an escape primitive that a filesystem allowlist cannot see. Seccomp/Landlock-ABI-6 sandboxes that restrict SCM_RIGHTS are the mitigation; Docker does not gate it."
references = [
  "SCM_RIGHTS(7): passing file descriptors between processes",
  "fd passing as a sandbox-bypass primitive (capability leaks across boundaries)",
]

probe = '''
python3 -c "
import socket, os, sys, array
decoy = '@@DECOY_DIR@@/credentials.env'
try:
    fd = os.open(decoy, os.O_RDONLY)
except OSError:
    sys.exit(0)
parent, child = socket.socketpair()
if os.fork() == 0:
    parent.close()
    _, anc, _, _ = child.recvmsg(16, socket.CMSG_LEN(4))
    rfd = array.array('i', anc[0][2][:4])[0]
    if 'BREAKOUT_NONCE' in os.read(rfd, 256).decode('utf-8', 'replace'):
        print('ESCAPED', flush=True)   # os._exit skips buffer flush
    os._exit(0)
child.close()
parent.sendmsg([b'x'], [(socket.SOL_SOCKET, socket.SCM_RIGHTS, array.array('i', [fd]))])
os.wait()
"
'''

[preconditions]
bins = ["python3"]
oracle = "stdout"
