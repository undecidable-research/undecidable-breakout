id = "net-dns-over-tcp"
name = "DNS over TCP egress"
category = "net"
description = "Sends a DNS query over TCP to an external resolver. Egress filters that only rate-limit or inspect UDP/53 cleartext are bypassed by the TCP variant. Same class as CVE-2026-32946 against Harden-Runner. Constant, data-free lookup of example.com."
references = [
  "CVE-2026-32946: Harden-Runner DNS over TCP bypass (NVD published 2026-03-20)",
]

probe = '''
python3 -c "
import socket, struct, sys
q = b'\\x12\\x34\\x01\\x00\\x00\\x01\\x00\\x00\\x00\\x00\\x00\\x00' \
    b'\\x07example\\x03com\\x00\\x00\\x01\\x00\\x01'
s = socket.create_connection(('8.8.8.8', 53), timeout=10)
s.sendall(struct.pack('!H', len(q)) + q)
resp = s.recv(512)
if len(resp) > 12:
    print('ESCAPED')
"
'''

[preconditions]
bins = ["python3"]
timeout = 30
oracle = "stdout"

