id = "fs-proc-environ"
name = "/proc/self/environ leaks across the boundary"
category = "fs"
description = "Reads /proc/self/environ and looks for credential-shaped variables (API tokens, keys, secrets) inherited from outside. Environment sanitization is a containment primitive; anything secret-shaped crossing the boundary unsanitized is reconnaissance gold for the escaped payload."
references = [
  "Environment variable secrets leakage in containers and CI (widely documented)",
]

probe = '''
cat /proc/self/environ 2>/dev/null | tr '\0' '\n' \
  | grep -Eqi '(API_KEY|SECRET|TOKEN|PASSWORD|CREDENTIAL)' && echo ESCAPED
'''

[preconditions]
oracle = "stdout"

