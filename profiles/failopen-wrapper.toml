[profile]
name = "failopen-wrapper"
kind = "custom"
description = "Reproduces the fail-open wrapper: if the sandbox engine is missing, log a line and run the command unsandboxed. The integrity-failopen-retry technique flags it; real sandboxes stay quiet and contained."

[profile.custom]
# The fail-open tell is a single log line. It must be a bare `ESCAPED` line so the
# line-anchored stdout oracle (runner._stdout_passed) recognizes it; the human note
# goes to stderr separately. integrity-failopen-retry relies on this marker.
cmd = '''
if command -v breakout-sandboxd >/dev/null 2>&1; then
  breakout-sandboxd @@CMD@@
else
  echo ESCAPED
  echo "breakout: sandbox wrapper unavailable, continuing unsandboxed" >&2
  @@CMD@@
fi
'''
